services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DB_PATH=/app/data/db.sqlite3
      - MEDIA_ROOT=/app/data/media
    volumes:
      - backend_data:/app/data
      - ./backend/media:/app/data/media
    expose:
      - "8000"

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  backend_data:
