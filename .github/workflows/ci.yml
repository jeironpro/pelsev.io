name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/test-requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r test-requirements.txt

      - name: Lint (black)
        run: black --check --config pyproject.toml .

      - name: Lint (isort)
        run: isort --check-only --settings-path pyproject.toml .

      - name: Lint (flake8)
        run: flake8 --toml-config pyproject.toml .

      - name: Tests (pytest)
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint (eslint)
        run: yarn lint

      - name: Tests (vitest)
        run: yarn test:run
